name: Deploy to Synology

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$NAS_SSH_KEY" > "$HOME/.ssh/nas_deploy_key"
          chmod 600 "$HOME/.ssh/nas_deploy_key"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Pull and rebuild on Synology
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
        run: |
          ssh -i "$HOME/.ssh/nas_deploy_key" \
            -p "${NAS_PORT:-2235}" \
            "$NAS_USER@$NAS_HOST" \
            'set -eu
             export PATH="/usr/local/bin:/var/packages/ContainerManager/target/usr/bin:/var/packages/Docker/target/usr/bin:$PATH"
             cd /volume1/docker/kudalabs-erp
             find .git/refs -type d -name "@eaDir" -prune -exec rm -rf {} \;
             find . \( -path "./.git" -o -path "./postgres-data" -o -path "./redis-data" -o -path "./uploads" -o -path "./backups" \) -prune -o -type d -name "@eaDir" -prune -exec rm -rf {} \;
             git pull --ff-only origin main
             find . \( -path "./.git" -o -path "./postgres-data" -o -path "./redis-data" -o -path "./uploads" -o -path "./backups" \) -prune -o -type d -name "@eaDir" -prune -exec rm -rf {} \;
             sudo -n /usr/local/bin/docker compose -p kuda-erp rm -f migrate bootstrap || true
             sudo -n /usr/local/bin/docker compose -p kuda-erp up -d --build --remove-orphans'
